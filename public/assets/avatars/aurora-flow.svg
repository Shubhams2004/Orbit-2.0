<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="auroraGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981">
        <animate attributeName="stop-color" values="#10b981;#06b6d4;#6366f1;#10b981" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#ec4899;#10b981;#8b5cf6" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="160" height="160" rx="80" fill="#030712" />

  <!-- Animated Wave 1 -->
  <path d="M 0,80 Q 40,40 80,80 T 160,80 L 160,160 L 0,160 Z" fill="url(#auroraGrad1)" opacity="0.6" filter="url(#softGlow)">
    <animate attributeName="d"
      values="M 0,80 Q 40,40 80,80 T 160,80 L 160,160 L 0,160 Z;
              M 0,80 Q 40,110 80,80 T 160,80 L 160,160 L 0,160 Z;
              M 0,80 Q 40,40 80,80 T 160,80 L 160,160 L 0,160 Z"
      dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Animated Wave 2 (Reversed & Shifted) -->
  <path d="M 0,90 Q 50,130 90,90 T 160,90 L 160,160 L 0,160 Z" fill="#06b6d4" opacity="0.45" filter="url(#softGlow)">
    <animate attributeName="d"
      values="M 0,90 Q 50,130 90,90 T 160,90 L 160,160 L 0,160 Z;
              M 0,90 Q 50,60 90,90 T 160,90 L 160,160 L 0,160 Z;
              M 0,90 Q 50,130 90,90 T 160,90 L 160,160 L 0,160 Z"
      dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Center Floating Aurora Orb -->
  <circle cx="80" cy="70" r="22" fill="#ffffff" opacity="0.9" filter="url(#softGlow)">
    <animate attributeName="cy" values="66;74;66" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="20;25;20" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.75;0.95;0.75" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Twinkling Stardust Points -->
  <circle cx="45" cy="40" r="1.5" fill="#a7f3d0">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="115" cy="45" r="2" fill="#c4b5fd">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="70" cy="30" r="1.5" fill="#67e8f9">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.8s" repeatCount="indefinite" />
  </circle>
</svg>
