<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="1">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#c084fc;#818cf8" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="1" />
    </radialGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Background -->
  <rect width="160" height="160" rx="80" fill="#090d16" />

  <!-- Outer Ambient Glow Pulsing -->
  <circle cx="80" cy="80" r="68" fill="none" stroke="url(#ring1)" stroke-width="1.5" opacity="0.3">
    <animate attributeName="r" values="64;70;64" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- Orbital Ring 1 (Clockwise Rotation) -->
  <g transform="translate(80,80)">
    <ellipse rx="58" ry="24" fill="none" stroke="url(#ring1)" stroke-width="2" stroke-dasharray="8 6" opacity="0.8" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
    </ellipse>
    <!-- Orbiting Particle 1 -->
    <circle cx="58" cy="0" r="4.5" fill="#38bdf8" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite" />
      <animate attributeName="r" values="3.5;5.5;3.5" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Orbital Ring 2 (Counter-Clockwise Rotation, Tilted) -->
  <g transform="translate(80,80) rotate(-60)">
    <ellipse rx="52" ry="22" fill="none" stroke="url(#ring2)" stroke-width="2" opacity="0.85" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite" />
    </ellipse>
    <!-- Orbiting Particle 2 -->
    <circle cx="52" cy="0" r="4" fill="#e879f9" filter="url(#glowFilter)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pulsing Quantum Core -->
  <circle cx="80" cy="80" r="28" fill="url(#coreGlow)" filter="url(#glowFilter)">
    <animate attributeName="r" values="24;30;24" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Radiant Inner Singularity -->
  <circle cx="80" cy="80" r="12" fill="#ffffff" opacity="0.95" filter="url(#glowFilter)">
    <animate attributeName="r" values="10;14;10" dur="1.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;1;0.8" dur="1.5s" repeatCount="indefinite" />
  </circle>

  <!-- Central Orbit Glyph -->
  <polygon points="80,68 88,80 80,92 72,80" fill="#4f46e5" opacity="0.7">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="12s" repeatCount="indefinite" />
  </polygon>
</svg>
