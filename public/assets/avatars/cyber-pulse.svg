<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Hex Background -->
  <rect width="160" height="160" rx="80" fill="#080c14" />

  <!-- Grid Scanlines -->
  <g opacity="0.15">
    <line x1="0" y1="40" x2="160" y2="40" stroke="#06b6d4" stroke-width="1" />
    <line x1="0" y1="80" x2="160" y2="80" stroke="#06b6d4" stroke-width="1" />
    <line x1="0" y1="120" x2="160" y2="120" stroke="#06b6d4" stroke-width="1" />
    <line x1="40" y1="0" x2="40" y2="160" stroke="#06b6d4" stroke-width="1" />
    <line x1="80" y1="0" x2="80" y2="160" stroke="#06b6d4" stroke-width="1" />
    <line x1="120" y1="0" x2="120" y2="160" stroke="#06b6d4" stroke-width="1" />
  </g>

  <!-- Rotating Outer Hexagon Shield -->
  <polygon points="80,24 128,52 128,108 80,136 32,108 32,52" fill="none" stroke="url(#cyberNeon)" stroke-width="2" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="14s" repeatCount="indefinite" />
  </polygon>

  <!-- Counter-Rotating Inner Hexagon -->
  <polygon points="80,38 116,60 116,100 80,122 44,100 44,60" fill="none" stroke="#ec4899" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.8" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="360 80 80" to="0 80 80" dur="9s" repeatCount="indefinite" />
  </polygon>

  <!-- Center Glowing Core Node -->
  <circle cx="80" cy="80" r="18" fill="#06b6d4" opacity="0.75" filter="url(#neonGlow)">
    <animate attributeName="r" values="16;22;16" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#06b6d4;#ec4899;#3b82f6;#06b6d4" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="80" cy="80" r="8" fill="#ffffff" filter="url(#neonGlow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1s" repeatCount="indefinite" />
  </circle>

  <!-- Corner Laser Nodes -->
  <circle cx="80" cy="24" r="3.5" fill="#06b6d4" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="14s" repeatCount="indefinite" />
  </circle>
  <circle cx="128" cy="108" r="3.5" fill="#ec4899" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="14s" repeatCount="indefinite" />
  </circle>
  <circle cx="32" cy="108" r="3.5" fill="#3b82f6" filter="url(#neonGlow)">
    <animateTransform attributeName="transform" type="rotate" from="0 80 80" to="360 80 80" dur="14s" repeatCount="indefinite" />
  </circle>
</svg>
