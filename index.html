<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orbit 2.0 — AI-Powered Task & Workspace Automation</title>
    <meta name="description" content="Professional AI-powered personal assistant and task automation workspace." />
    <meta property="og:title" content="Orbit 2.0 — AI-Powered Task & Workspace Automation" />
    <meta property="og:description" content="Professional AI-powered personal assistant and task automation workspace." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('orbit_user_settings_v2');
          if (stored) {
            var theme = JSON.parse(stored).theme;
            if (theme === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
            } else {
              document.documentElement.classList.add('dark');
              document.documentElement.classList.remove('light');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-neutral-950 dark:text-neutral-100 antialiased font-sans selection:bg-indigo-500/20 selection:text-indigo-600 dark:selection:text-indigo-300 min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
